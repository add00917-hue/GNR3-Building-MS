<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GNR3 ระบบบริหารจัดการสำนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #04091a;
      --bg2:       #070d20;
      --surface:   rgba(255,255,255,0.035);
      --surface-h: rgba(255,255,255,0.068);
      --border:    rgba(255,255,255,0.065);
      --border-h:  rgba(255,255,255,0.18);
      --text:      #e8eeff;
      --text2:     #6b7fa8;
      --text3:     #2e3a55;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --green:     #22c55e;
      --yellow:    #fbbf24;
      --red:       #f87171;
      --blue:      #38bdf8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', 'Kanit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* BG FX */
    .bg-fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .orb1 { width:900px; height:900px; top:-300px; left:-250px; background: radial-gradient(circle, rgba(20,70,180,0.38), transparent 70%); }
    .orb2 { width:700px; height:700px; bottom:-250px; right:-180px; background: radial-gradient(circle, rgba(5,65,80,0.38), transparent 70%); }
    .orb3 { width:500px; height:500px; top:40%; left:55%; background: radial-gradient(circle, rgba(60,10,120,0.15), transparent 70%); }

    /* LAYOUT */
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }

    /* HEADER */
    .hdr {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 1.4rem 0 1.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      animation: slideDown .6s cubic-bezier(.22,1,.36,1) both;
    }
    .hdr-l { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(145deg, #1a4fd8 0%, #0891b2 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 28px rgba(8,145,178,0.5), 0 4px 14px rgba(0,0,0,0.6);
    }
    .logo span { font-family: 'Kanit'; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 1.5px; }
    .htitle h1 { font-family: 'Kanit'; font-size: clamp(15px,2.2vw,20px); font-weight: 600; color: var(--text); line-height: 1.2; }
    .htitle p { font-size: 10px; color: var(--text2); margin-top: 3px; letter-spacing: .5px; }
    .clock { text-align: right; flex-shrink: 0; }
    .clock-t { font-family: 'Kanit'; font-size: clamp(20px,3.2vw,29px); font-weight: 300; color: #22d3ee; letter-spacing: 3px; line-height: 1; }
    .clock-d { font-size: 10px; color: var(--text3); margin-top: 4px; letter-spacing: .3px; }

    /* NAV TABS */
    .nav-tabs {
      display: flex; gap: 4px;
      padding: .8rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .nav-tab {
      font-family: 'Kanit'; font-size: 11px; font-weight: 500;
      letter-spacing: .5px; padding: 7px 18px; border-radius: var(--radius-sm);
      border: 1px solid transparent; cursor: pointer;
      color: var(--text2); background: transparent;
      transition: all .18s ease; display: flex; align-items: center; gap: 6px;
    }
    .nav-tab:hover { background: var(--surface); border-color: var(--border); color: var(--text); }
    .nav-tab.active { background: var(--surface-h); border-color: var(--border-h); color: var(--text); }
    .nav-tab svg { opacity: .7; }
    .nav-tab.active svg { opacity: 1; }

    /* VIEWS */
    .view { display: none; }
    .view.active { display: block; }
    .view-main.active  { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    .view-sub.active   { animation: slideRight .4s cubic-bezier(.22,1,.36,1) both; }
    .view-dash.active  { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }

    @keyframes slideDown  { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp     { from{opacity:0;transform:translateY(22px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes slideRight { from{opacity:0;transform:translateX(36px)} to{opacity:1;transform:translateX(0)} }
    @keyframes cardUp     { from{opacity:0;transform:translateY(26px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }

    /* ═══════════════════════════════════
       DASHBOARD
    ═══════════════════════════════════ */
    .dash-kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 1.75rem;
    }
    @media(max-width:760px){ .dash-kpi-row { grid-template-columns: repeat(2,1fr); } }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.2rem 1.1rem;
      position: relative; overflow: hidden;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .kpi-card:nth-child(1){animation-delay:.05s}
    .kpi-card:nth-child(2){animation-delay:.1s}
    .kpi-card:nth-child(3){animation-delay:.15s}
    .kpi-card:nth-child(4){animation-delay:.2s}
    .kpi-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background: var(--kc, #38bdf8);
    }
    .kpi-label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: .6rem; }
    .kpi-val { font-family: 'Kanit'; font-size: 32px; font-weight: 300; line-height: 1; color: var(--kc, var(--text)); }
    .kpi-sub { font-size: 10px; color: var(--text3); margin-top: 5px; }

    .dash-row2 {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 14px;
      margin-bottom: 1.75rem;
    }
    @media(max-width:680px){ .dash-row2 { grid-template-columns: 1fr; } }

    .dash-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.3rem 1.3rem;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) .25s both;
    }
    .dash-panel-title {
      font-family: 'Kanit'; font-size: 11px; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 1.1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-panel-title span { color: var(--text2); font-size: 10px; letter-spacing: 1px; }

    /* status bar chart */
    .status-chart { display: flex; flex-direction: column; gap: 10px; }
    .sc-row { display: flex; align-items: center; gap: 10px; }
    .sc-label { font-size: 11px; color: var(--text2); width: 90px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sc-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .sc-bar { height: 100%; border-radius: 4px; transition: width 1s cubic-bezier(.22,1,.36,1); }
    .sc-pct { font-family: 'Kanit'; font-size: 10px; color: var(--text3); width: 30px; text-align: right; flex-shrink:0; }

    /* status pill list */
    .status-list { display: flex; flex-direction: column; gap: 9px; }
    .sl-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 9px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .sl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
    .sl-name { font-size: 11px; color: var(--text); flex: 1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sl-status { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; flex-shrink:0; }
    .sl-status.live   { color: #22c55e; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.2); }
    .sl-status.active { color: #38bdf8; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.2); }
    .sl-status.wip    { color: var(--text3); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }

    .dash-row3 {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.3rem;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) .35s both;
    }
    .cat-progress-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-top: .8rem;
    }
    @media(max-width:680px){ .cat-progress-grid { grid-template-columns: repeat(2,1fr); } }
    .cpg-item { display: flex; flex-direction: column; gap: 5px; }
    .cpg-name { font-size: 10px; color: var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cpg-track { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow:hidden; }
    .cpg-fill { height: 100%; border-radius: 2px; }
    .cpg-nums { display: flex; justify-content: space-between; font-size: 9px; color: var(--text3); }

    /* ═══════════════════════════════════
       MAIN MENU GRID
    ═══════════════════════════════════ */
    .sec-label {
      font-family: 'Kanit'; font-size: 10px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 1.5rem;
      animation: fadeUp .5s ease .15s both;
    }
    .main-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    }
    @media(max-width:820px){ .main-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:420px){ .main-grid { grid-template-columns: repeat(2,1fr); gap:10px; } }

    .cat-card {
      position: relative;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.4rem 1.2rem 1.15rem;
      cursor: pointer; text-decoration: none;
      display: block; overflow: hidden;
      transition: transform .24s cubic-bezier(.22,1,.36,1), border-color .22s, background .22s, box-shadow .24s;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .cat-card:nth-child(1){animation-delay:.06s} .cat-card:nth-child(2){animation-delay:.11s}
    .cat-card:nth-child(3){animation-delay:.16s} .cat-card:nth-child(4){animation-delay:.21s}
    .cat-card:nth-child(5){animation-delay:.26s} .cat-card:nth-child(6){animation-delay:.31s}
    .cat-card:nth-child(7){animation-delay:.36s} .cat-card:nth-child(8){animation-delay:.41s}
    .cat-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background: var(--ac, transparent); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transition: height .22s ease;
    }
    .cat-card::after {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse at 50% -5%, var(--ac), transparent 65%);
      opacity: 0; transition: opacity .3s; pointer-events:none;
    }
    .cat-card:hover { transform: translateY(-6px) scale(1.025); border-color: var(--border-h); background: var(--surface-h); box-shadow: 0 22px 55px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,0.06); }
    .cat-card:hover::before { height: 4px; }
    .cat-card:hover::after { opacity: .07; }
    .cat-card:active { transform: scale(.96); }

    .cat-num { font-family: 'Kanit'; font-size: 10px; font-weight: 600; color: var(--ac); letter-spacing: 1.5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); padding: 2px 9px; border-radius: 20px; display: inline-block; margin-bottom: 1rem; }
    .cat-ico { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; margin-bottom: .85rem; transition: transform .22s ease; }
    .cat-card:hover .cat-ico { transform: scale(1.13) rotate(-5deg); }
    .cat-name { font-family: 'Kanit'; font-size: 13.5px; font-weight: 500; line-height: 1.4; margin-bottom: 2px; color: var(--text); }
    .cat-desc { font-size: 9.5px; color: var(--text2); line-height: 1.4; }
    .cat-badge { position: absolute; top: 1rem; right: 1rem; font-size: 8.5px; color: var(--text3); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 20px; letter-spacing: .5px; }
    .direct-arrow { position: absolute; bottom: 1.1rem; right: 1.1rem; color: var(--text3); opacity: .55; transition: opacity .2s, transform .2s; }
    .cat-card:hover .direct-arrow { opacity: .9; transform: translate(2px,-2px); }

    /* ═══════════════════════════════════
       SUB VIEW
    ═══════════════════════════════════ */
    .sub-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 1.6rem; flex-wrap: wrap; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Kanit'; font-size: 11px; font-weight: 500; letter-spacing: .5px;
      color: var(--text2); cursor: pointer;
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 15px; border-radius: var(--radius-sm);
      text-decoration: none; flex-shrink: 0;
      transition: background .18s, border-color .18s, color .18s;
    }
    .back-btn:hover { background: var(--surface-h); border-color: var(--border-h); color: var(--text); }
    .sub-cat-ico { width: 50px; height: 50px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sub-meta { flex: 1; min-width: 0; }
    .sub-meta-num { font-family: 'Kanit'; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 3px; }
    .sub-meta-title { font-family: 'Kanit'; font-size: clamp(17px,3vw,25px); font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub-meta-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .divider { height: 1px; margin-bottom: 1.5rem; background: linear-gradient(90deg, transparent, var(--border) 35%, var(--border) 65%, transparent); }
    .sub-count-label { font-family: 'Kanit'; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 1.25rem; }

    /* ADD BUTTON */
    .add-item-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'Kanit'; font-size: 11px; font-weight: 500; letter-spacing: .5px;
      color: #fff; cursor: pointer; margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #1a4fd8 0%, #0891b2 100%);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 18px; border-radius: var(--radius-sm);
      transition: opacity .18s, transform .18s, box-shadow .18s;
      box-shadow: 0 4px 18px rgba(8,145,178,0.3);
    }
    .add-item-btn:hover { opacity: .88; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(8,145,178,0.4); }
    .add-item-btn:active { transform: scale(.96); }

    /* SUB GRID */
    .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media(max-width:680px){ .sub-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:380px){ .sub-grid { grid-template-columns: 1fr; } }

    .sub-card {
      display: flex; flex-direction: column; gap: 0;
      padding: 1.15rem 1.05rem 1rem;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid var(--ac, transparent);
      border-radius: var(--radius-md);
      text-decoration: none; color: var(--text);
      position: relative; overflow: hidden;
      transition: transform .2s cubic-bezier(.22,1,.36,1), border-color .18s, background .18s, box-shadow .2s;
      opacity: 0; animation: cardUp .45s cubic-bezier(.22,1,.36,1) both;
    }
    .sub-card:hover { transform: translateY(-4px); border-right-color: var(--border-h); border-top-color: var(--border-h); border-bottom-color: var(--border-h); background: var(--surface-h); box-shadow: 0 14px 40px rgba(0,0,0,.45); }
    .sub-card:active { transform: scale(.97); }
    .sub-card.wip { cursor: not-allowed; }
    .sub-card.wip:hover { transform: none; box-shadow: none; }

    .sub-ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: .7rem; flex-shrink: 0; }
    .sub-name { font-family: 'Kanit'; font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 3px; color: var(--text); }
    .sub-desc-text { font-size: 10px; color: var(--text2); line-height: 1.4; margin-bottom: .55rem; }
    .sub-link-ico { position: absolute; top: .85rem; right: .85rem; color: var(--text3); transition: color .18s, transform .18s; }
    .sub-card:hover .sub-link-ico { color: var(--ac); transform: translate(2px,-2px); }

    /* STATUS BADGES */
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
      width: fit-content; margin-top: auto;
    }
    .status-badge.live   { color: #22c55e; background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.22); }
    .status-badge.active { color: #38bdf8; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.22); }
    .status-badge.wip    { color: var(--text3); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
    .status-badge .dot   { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; margin-right: 5px; vertical-align: middle; animation: livePulse 2.2s infinite; }
    @keyframes livePulse { 0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,.5); } 50%{ box-shadow:0 0 0 5px rgba(34,197,94,0); } }

    /* ═══════════════════════════════════
       MODAL — Add Sub Item
    ═══════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(4,9,26,0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .22s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #0b1228;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      padding: 2rem;
      width: min(480px, calc(100vw - 2rem));
      transform: translateY(20px) scale(.97);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-title {
      font-family: 'Kanit'; font-size: 16px; font-weight: 600;
      color: var(--text); margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text2);
      transition: background .15s, color .15s;
    }
    .modal-close:hover { background: var(--surface-h); color: var(--text); }

    .form-group { margin-bottom: 1.1rem; }
    .form-label { font-family: 'Kanit'; font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: .45rem; display: block; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-sm); padding: 9px 12px;
      color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 13px;
      outline: none; transition: border-color .18s, background .18s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: rgba(34,211,238,0.45); background: rgba(255,255,255,0.06);
    }
    .form-select { appearance: none; cursor: pointer; }
    .form-select option { background: #0b1228; }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; justify-content: flex-end; }
    .btn-cancel {
      font-family: 'Kanit'; font-size: 11px; font-weight: 500;
      padding: 9px 20px; border-radius: var(--radius-sm); cursor: pointer;
      background: transparent; border: 1px solid var(--border); color: var(--text2);
      transition: all .15s;
    }
    .btn-cancel:hover { background: var(--surface); color: var(--text); }
    .btn-save {
      font-family: 'Kanit'; font-size: 11px; font-weight: 500;
      padding: 9px 24px; border-radius: var(--radius-sm); cursor: pointer;

/* Load / save from localStorage */
function loadData() {
  try {
    const saved = localStorage.getItem('gnr3_sections_v3');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
  } catch(e) {
    return JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
  }
}
function saveData() {
  localStorage.setItem('gnr3_sections_v3', JSON.stringify(SECTIONS));
}

let SECTIONS = loadData();
let currentSecId = null;

/* ═══════════════════════════════════
   TAB SWITCHING
═══════════════════════════════════ */
let currentTab = 'main';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  // hide views
  document.getElementById('view-dash').classList.remove('active');
  document.getElementById('view-main').classList.remove('active');
  document.getElementById('view-sub').classList.remove('active');
  if (tab === 'dashboard') {
    // force reflow
    const vd = document.getElementById('view-dash');
    void vd.offsetWidth;
    renderDashboard();
    vd.classList.add('active');
    history.replaceState('', document.title, window.location.pathname);
  } else {
    route();
  }
}

/* ═══════════════════════════════════
   DASHBOARD
═══════════════════════════════════ */
function renderDashboard() {
  const allItems = SECTIONS.flatMap(s => s.items);
  const totalSections = SECTIONS.length;
  const totalItems = allItems.length;
  const liveCount  = allItems.filter(i => i.status === 'live').length;
  const activeCount= allItems.filter(i => i.status === 'active').length;
  const wipCount   = allItems.filter(i => i.status === 'wip').length;

  /* KPI */
  const kpis = [
    { label:'หมวดหมู่ทั้งหมด', val: totalSections, sub:'Categories', color:'#22d3ee' },
    { label:'รายการย่อยทั้งหมด', val: totalItems,   sub:'Sub Items',  color:'#a78bfa' },
    { label:'Live — ใช้งานได้', val: liveCount+activeCount, sub:'Active Items', color:'#22c55e' },
    { label:'WIP — กำลังพัฒนา', val: wipCount,     sub:'In Progress', color:'#fbbf24' },
  ];
  const kpiRow = document.getElementById('kpi-row');
  kpiRow.innerHTML = kpis.map(k => `
    <div class="kpi-card" style="--kc:${k.color}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');

  /* Section bar chart */
  document.getElementById('total-items-label').textContent = `${totalItems} รายการ`;
  const chartEl = document.getElementById('section-chart');
  const maxItems = Math.max(...SECTIONS.filter(s=>s.items.length>0).map(s=>s.items.length), 1);
  chartEl.innerHTML = SECTIONS.filter(s=>!s.direct || s.items.length).map(s => {
    const pct = s.items.length ? Math.round((s.items.length/maxItems)*100) : 0;
    return `
    <div class="sc-row">
      <div class="sc-label" title="${s.title}">${s.id} ${s.title}</div>
      <div class="sc-bar-wrap">
        <div class="sc-bar" style="width:${pct}%;background:${s.color}"></div>
      </div>
      <div class="sc-pct">${s.items.length}</div>
    </div>`;
  }).join('');
  setTimeout(()=>{
    chartEl.querySelectorAll('.sc-bar').forEach(b => { const w=b.style.width; b.style.width='0'; setTimeout(()=>b.style.width=w,50); });
  },50);

  /* Live list */
  const liveItems = SECTIONS.flatMap(s => s.items.filter(i => i.status==='live'||i.status==='active').slice(0,2).map(i=>({...i,secColor:s.color,secTitle:s.title})));
  document.getElementById('live-count-label').textContent = `${liveCount+activeCount} รายการ`;
  document.getElementById('live-list').innerHTML = liveItems.slice(0,7).map(i => `
    <div class="sl-row">
      <div class="sl-dot" style="background:${i.secColor}"></div>
      <div class="sl-name">${i.name}</div>
      <div class="sl-status ${i.status}">${i.status==='live'?'Live':'Active'}</div>
    </div>`).join('') || '<div style="font-size:11px;color:var(--text3);padding:8px 0">ยังไม่มีรายการที่ใช้งานได้</div>';

  /* Category progress */
  document.getElementById('cat-progress').innerHTML = SECTIONS.filter(s=>!s.direct).map(s => {
    const total = s.items.length;
    const done  = s.items.filter(i=>i.status!=='wip').length;
    const pct   = total ? Math.round((done/total)*100) : 0;
    return `
    <div class="cpg-item">
      <div class="cpg-name" title="${s.title}">${s.id} ${s.title}</div>
      <div class="cpg-track"><div class="cpg-fill" style="width:${pct}%;background:${s.color}"></div></div>
      <div class="cpg-nums"><span>${done}/${total}</span><span style="color:${s.color}">${pct}%</span></div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════
   RENDER MAIN GRID
═══════════════════════════════════ */
function hex2rgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderMain() {
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';
  SECTIONS.forEach(sec => {
    const isDirect = sec.direct && sec.href;
    const el = document.createElement(isDirect ? 'a' : 'div');
    if (isDirect) {
      el.href = sec.href;
      el.target = sec.href.startsWith('http') ? '_blank' : '_self';
    } else {
      el.addEventListener('click', () => navigate(sec.id));
    }
    el.className = 'cat-card';
    el.style.setProperty('--ac', sec.color);

    const liveItems = sec.items.filter(i=>i.status==='live').length;
    const activeItems = sec.items.filter(i=>i.status!=='wip').length;
    const badgeHtml = sec.items.length
      ? `<span class="cat-badge">${sec.items.length} รายการ</span>`
      : `<span class="cat-badge" style="color:${sec.color}">→ ลิงก์</span>`;

    const arrowHtml = isDirect ? `<span class="direct-arrow">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg></span>` : '';

    const progressHtml = (!isDirect && sec.items.length > 0) ? (() => {
      const pct = Math.round((activeItems/sec.items.length)*100);
      return `<div style="margin-top:.65rem">
        <div style="height:2px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${sec.color};border-radius:2px;transition:width 1s"></div>
        </div>
        <div style="font-size:8.5px;color:var(--text3);margin-top:3px">${activeItems}/${sec.items.length} พร้อมใช้</div>
      </div>`;
    })() : '';

    el.innerHTML = `${badgeHtml}
      <span class="cat-num">${sec.id}</span>
      <div class="cat-ico" style="color:${sec.color}; background:${hex2rgba(sec.color,0.12)}">${sec.icon}</div>
      <div class="cat-name">${sec.title}</div>
      <div class="cat-desc">${sec.sub}</div>
      ${progressHtml}
      ${arrowHtml}`;
    grid.appendChild(el);
  });
}

/* ═══════════════════════════════════
   RENDER SUB GRID
═══════════════════════════════════ */
function renderSub(secId) {
  const sec = SECTIONS.find(s => s.id === secId);
  if (!sec) { navigate(null); return; }
  currentSecId = secId;

  const bar = document.getElementById('sub-topbar');
  bar.innerHTML = `
    <a class="back-btn" href="#" id="back-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      หน้าหลัก
    </a>
    <div class="sub-cat-ico" style="color:${sec.color}; background:${hex2rgba(sec.color,0.12)}">${sec.icon}</div>
    <div class="sub-meta">
      <div class="sub-meta-num" style="color:${sec.color}">หมวด ${sec.id}</div>
      <div class="sub-meta-title">${sec.title}</div>
      <div class="sub-meta-sub">${sec.sub}</div>
    </div>`;
  document.getElementById('back-btn').addEventListener('click', e => { e.preventDefault(); navigate(null); });

  const liveN   = sec.items.filter(i=>i.status==='live').length;
  const activeN = sec.items.filter(i=>i.status==='active').length;
  const wipN    = sec.items.filter(i=>i.status==='wip').length;
  document.getElementById('sub-count-label').innerHTML =
    `${sec.items.length} รายการ &nbsp;·&nbsp; <span style="color:#22c55e">${liveN} live</span> &nbsp;·&nbsp; <span style="color:#38bdf8">${activeN} active</span> &nbsp;·&nbsp; <span style="color:var(--text3)">${wipN} wip</span>`;

  const grid = document.getElementById('sub-grid');
  grid.innerHTML = '';

  sec.items.forEach((item, i) => {
    const isWip = item.status === 'wip';
    const el = document.createElement('a');
    el.className = 'sub-card' + (isWip ? ' wip' : '');
    el.style.setProperty('--ac', sec.color);
    el.style.animationDelay = `${i * 0.055}s`;

    if (isWip) {
      el.href = '#';
      el.addEventListener('click', e => e.preventDefault());
    } else {
      el.href = item.href || '#';
      el.target = item.href && item.href.startsWith('http') ? '_blank' : '_self';
    }

    const liveDot = item.status === 'live' ? `<span class="live-dot"></span>` : '';
    const statusBadge = `<span class="status-badge ${item.status}"><span class="dot"></span>${
      item.status==='live' ? 'Live' : item.status==='active' ? 'Active' : 'In Progress'
    }</span>`;
    const linkSvg = !isWip ? `<span class="sub-link-ico">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        ${item.href && item.href.startsWith('http')
          ? '<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
          : '<polyline points="9 18 15 12 9 6"/>'}
      </svg></span>` : '';

    const iconHtml = item.isCustom
      ? `<div class="sub-ico" style="color:${sec.color}; background:${hex2rgba(sec.color,0.12)}; font-size:20px; line-height:1">${item.icon||'📄'}</div>`
      : `<div class="sub-ico" style="color:${sec.color}; background:${hex2rgba(sec.color,0.12)}">${item.icon}</div>`;

    el.innerHTML = `${linkSvg}
      ${iconHtml}
      <div class="sub-name">${liveDot}${item.name}</div>
      <div class="sub-desc-text">${item.desc}</div>
      ${statusBadge}`;
    grid.appendChild(el);
  });
}

/* ═══════════════════════════════════
   ADD ITEM MODAL
═══════════════════════════════════ */
function openAddModal() {
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-href').value = '';
  document.getElementById('inp-status').value = 'active';
  document.getElementById('inp-icon').value = '';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function saveItem() {
  const name   = document.getElementById('inp-name').value.trim();
  const desc   = document.getElementById('inp-desc').value.trim();
  const href   = document.getElementById('inp-href').value.trim();
  const status = document.getElementById('inp-status').value;
  const iconIn = document.getElementById('inp-icon').value.trim();

  if (!name) { showToast('⚠ กรุณาระบุชื่อรายการ'); return; }

  const sec = SECTIONS.find(s => s.id === currentSecId);
  if (!sec) return;

  sec.items.push({
    name, desc: desc || name, href: href || '#',
    status, isCustom: true,
    icon: iconIn || '📄'
  });

  saveData();
  closeModal();
  renderSub(currentSecId);
  showToast(`✓ เพิ่ม "${name}" เรียบร้อยแล้ว`);
}

/* ═══════════════════════════════════
   TOAST
═══════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════
   ROUTER
═══════════════════════════════════ */
function navigate(secId) {
  if (secId) { location.hash = secId; }
  else { history.pushState('', document.title, window.location.pathname + window.location.search); route(); }
}

function route() {
  if (currentTab === 'dashboard') return;
  const hash  = location.hash.replace('#','');
  const found = hash && SECTIONS.find(s => s.id === hash);
  const vMain = document.getElementById('view-main');
  const vSub  = document.getElementById('view-sub');
  const vDash = document.getElementById('view-dash');
  vMain.classList.remove('active');
  vSub.classList.remove('active');
  vDash.classList.remove('active');
  void vMain.offsetWidth;
  if (found) {
    void vSub.offsetWidth;
    renderSub(found.id);
    vSub.classList.add('active');
    // keep main tab active in nav
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'main'));
    currentTab = 'main';
  } else {
    renderMain();
    vMain.classList.add('active');
  }
}

/* Close modal on overlay click */
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

window.addEventListener('hashchange', route);
window.addEventListener('load', route);

/* ═══════════════════════════════════
   CLOCK
═══════════════════════════════════ */
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function tick() {
  const n = new Date();
  document.getElementById('ct').textContent =
    [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
  document.getElementById('cd').textContent =
    `${DAYS[n.getDay()]}  ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()+543}`;
}
tick(); setInterval(tick, 1000);
