<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GNR3 ระบบบริหารจัดการสำนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #F2F4F8;
      --white:    #FFFFFF;
      --surface:  #FFFFFF;
      --border:   #E8ECF4;
      --text:     #1A2340;
      --text2:    #6B7A9B;
      --text3:    #A8B4CC;

      --blue:    #2B5CFF;
      --blue2:   #4F8EFF;
      --red:     #FF3B5C;
      --yellow:  #FFB800;
      --green:   #00C97A;
      --purple:  #9B5DFF;
      --coral:   #FF6B4A;

      --grad-blue:   linear-gradient(135deg, #2B5CFF 0%, #4F8EFF 100%);
      --grad-red:    linear-gradient(135deg, #FF3B5C 0%, #FF7A8A 100%);
      --grad-yellow: linear-gradient(135deg, #FFB800 0%, #FFD966 100%);
      --grad-green:  linear-gradient(135deg, #00C97A 0%, #4EDDAA 100%);
      --grad-purple: linear-gradient(135deg, #9B5DFF 0%, #C49BFF 100%);
      --grad-coral:  linear-gradient(135deg, #FF6B4A 0%, #FFA08A 100%);
      --grad-navy:   linear-gradient(135deg, #1A2340 0%, #2B3D70 100%);
      --grad-cyan:   linear-gradient(135deg, #0097FF 0%, #00CFFF 100%);

      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 2px 8px rgba(26,35,64,0.07);
      --shadow-md: 0 8px 32px rgba(26,35,64,0.10);
      --shadow-lg: 0 20px 60px rgba(26,35,64,0.14);
      --shadow-col: 0 12px 40px rgba(43,92,255,0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Kanit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── BG DECOR ── */
    .bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-blob {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: .45;
    }
    .blob1 { width: 700px; height: 700px; top: -200px; right: -150px; background: radial-gradient(circle, #b8c9ff, transparent 70%); }
    .blob2 { width: 500px; height: 500px; bottom: -100px; left: -120px; background: radial-gradient(circle, #ffd6dc, transparent 70%); }
    .blob3 { width: 400px; height: 400px; top: 50%; left: 40%; background: radial-gradient(circle, #fff4c2, transparent 70%); opacity: .3; }

    .wrap {
      position: relative; z-index: 1;
      max-width: 1160px; margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    /* ── TOPBAR (single row) ── */
    .topbar {
      display: flex; align-items: center; gap: 0;
      padding: 0; margin-bottom: 1.8rem;
      background: var(--white); border-radius: var(--radius-xl);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      overflow: hidden;
      animation: slideDown .6s cubic-bezier(.22,1,.36,1) both;
    }

    /* Brand section */
    .topbar-brand {
      display: flex; align-items: center; gap: 12px;
      padding: .75rem 1.2rem .75rem 1rem; flex-shrink: 0;
      border-right: 1px solid var(--border);
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: var(--grad-blue);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(43,92,255,0.35);
      position: relative; overflow: hidden;
    }
    .logo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
    }
    .logo span { font-family: 'Kanit'; font-size: 11px; font-weight: 800; color: #fff; letter-spacing: 1px; position: relative; z-index: 1; }

    .htitle h1 {
      font-family: 'Kanit'; font-size: 14px;
      font-weight: 700; color: var(--text); line-height: 1.2; white-space: nowrap;
    }
    .htitle p { font-size: 10px; color: var(--text2); margin-top: 1px; letter-spacing: .3px; white-space: nowrap; }

    /* Nav tabs section - inline */
    .nav-tabs {
      display: flex; gap: 4px; flex: 1;
      padding: .55rem .7rem;
      align-items: center;
    }
    .nav-tab {
      font-family: 'Kanit'; font-size: 12px; font-weight: 600;
      letter-spacing: .3px; padding: 8px 18px; border-radius: var(--radius-sm);
      border: none; cursor: pointer;
      color: var(--text2); background: transparent;
      transition: all .2s ease; display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--blue); background: rgba(43,92,255,0.06); }
    .nav-tab.active {
      background: var(--grad-blue); color: #fff;
      box-shadow: 0 4px 14px rgba(43,92,255,0.28);
    }
    .nav-tab.active svg { opacity: 1; }

    /* Clock - right side */
    .topbar-clock {
      padding: .6rem 1.2rem; border-left: 1px solid var(--border);
      text-align: center; flex-shrink: 0;
    }
    .clock-t {
      font-family: 'Kanit'; font-size: 20px;
      font-weight: 600; color: var(--blue); letter-spacing: 2px; line-height: 1;
    }
    .clock-d { font-size: 10px; color: var(--text3); margin-top: 2px; }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; }
    .view-main.active  { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
    .view-sub.active   { animation: slideRight .4s cubic-bezier(.22,1,.36,1) both; }
    .view-dash.active  { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }

    @keyframes slideDown  { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp     { from{opacity:0;transform:translateY(20px) scale(.99)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes slideRight { from{opacity:0;transform:translateX(36px)} to{opacity:1;transform:translateX(0)} }
    @keyframes cardUp     { from{opacity:0;transform:translateY(28px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }

    /* ══════════════════════════
       DASHBOARD
    ══════════════════════════ */
    .dash-kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-bottom: 1.6rem;
    }
    @media(max-width:760px){ .dash-kpi-row { grid-template-columns: repeat(2,1fr); } }

    .kpi-card {
      border-radius: var(--radius-lg); padding: 1.4rem 1.3rem;
      position: relative; overflow: hidden;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) both;
      color: #fff; box-shadow: var(--shadow-md);
    }
    .kpi-card:nth-child(1){ background: var(--grad-blue); box-shadow: 0 12px 40px rgba(43,92,255,0.28); animation-delay:.05s; }
    .kpi-card:nth-child(2){ background: var(--grad-purple); box-shadow: 0 12px 40px rgba(155,93,255,0.28); animation-delay:.10s; }
    .kpi-card:nth-child(3){ background: var(--grad-green); box-shadow: 0 12px 40px rgba(0,201,122,0.28); animation-delay:.15s; }
    .kpi-card:nth-child(4){ background: var(--grad-yellow); box-shadow: 0 12px 40px rgba(255,184,0,0.28); animation-delay:.20s; }
    .kpi-card:nth-child(4) .kpi-val,
    .kpi-card:nth-child(4) .kpi-label,
    .kpi-card:nth-child(4) .kpi-sub { color: #7A5500; }
    .kpi-card::before {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .kpi-card::after {
      content: ''; position: absolute; bottom: -20px; right: 20px;
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255,255,255,0.10);
    }
    .kpi-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: .5rem; opacity: .85; }
    .kpi-val { font-family: 'Kanit'; font-size: 38px; font-weight: 700; line-height: 1; position: relative; z-index: 1; }
    .kpi-sub { font-size: 10px; margin-top: 5px; opacity: .75; }

    .dash-row2 {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px;
      margin-bottom: 1.6rem;
    }
    @media(max-width:680px){ .dash-row2 { grid-template-columns: 1fr; } }

    .dash-panel {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) .25s both;
    }
    .dash-panel-title {
      font-family: 'Kanit'; font-size: 13px; font-weight: 700;
      color: var(--text); margin-bottom: 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-panel-title .badge {
      font-size: 10px; font-weight: 600; color: var(--blue);
      background: rgba(43,92,255,0.08); padding: 3px 10px;
      border-radius: 20px;
    }

    .status-chart { display: flex; flex-direction: column; gap: 12px; }
    .sc-row { display: flex; align-items: center; gap: 10px; }
    .sc-label { font-size: 11px; color: var(--text2); width: 100px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sc-bar-wrap { flex: 1; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
    .sc-bar { height: 100%; border-radius: 5px; transition: width 1.2s cubic-bezier(.22,1,.36,1); }
    .sc-pct { font-family: 'Kanit'; font-size: 11px; font-weight: 600; color: var(--text2); width: 24px; text-align: right; flex-shrink:0; }

    .status-list { display: flex; flex-direction: column; gap: 8px; }
    .sl-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      background: var(--bg); border: 1px solid var(--border);
      transition: transform .15s;
    }
    .sl-row:hover { transform: translateX(3px); }
    .sl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink:0; }
    .sl-name { font-size: 12px; color: var(--text); flex: 1; font-weight: 500; }
    .sl-status { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; flex-shrink:0; }
    .sl-status.live   { color: #00C97A; background: rgba(0,201,122,0.12); }
    .sl-status.active { color: var(--blue); background: rgba(43,92,255,0.10); }
    .sl-status.wip    { color: var(--text3); background: rgba(168,180,204,0.15); }

    .dash-row3 {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) .35s both;
    }
    .cat-progress-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-top: 1rem;
    }
    @media(max-width:680px){ .cat-progress-grid { grid-template-columns: repeat(2,1fr); } }
    .cpg-item { display: flex; flex-direction: column; gap: 6px; }
    .cpg-name { font-size: 11px; color: var(--text2); font-weight: 600; }
    .cpg-track { height: 6px; background: var(--bg); border-radius: 3px; overflow:hidden; }
    .cpg-fill { height: 100%; border-radius: 3px; }
    .cpg-nums { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-weight: 600; }

    /* ══════════════════════════
       SECTION LABEL
    ══════════════════════════ */
    .sec-label-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
      animation: fadeUp .5s ease .1s both;
    }
    .sec-label {
      font-family: 'Kanit'; font-size: 18px; font-weight: 700; color: var(--text);
    }
    .sec-label span { color: var(--blue); }
    .sec-sublabel { font-size: 12px; color: var(--text3); font-weight: 400; margin-left: 8px; }

    /* ══════════════════════════
       MAIN GRID
    ══════════════════════════ */
    .main-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    @media(max-width:820px){ .main-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:420px){ .main-grid { grid-template-columns: repeat(2,1fr); gap:10px; } }

    .cat-card {
      position: relative;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 0;
      cursor: pointer; text-decoration: none;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform .26s cubic-bezier(.22,1,.36,1), box-shadow .26s;
      opacity: 0; animation: cardUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .cat-card:nth-child(1){animation-delay:.05s} .cat-card:nth-child(2){animation-delay:.10s}
    .cat-card:nth-child(3){animation-delay:.15s} .cat-card:nth-child(4){animation-delay:.20s}
    .cat-card:nth-child(5){animation-delay:.25s} .cat-card:nth-child(6){animation-delay:.30s}
    .cat-card:nth-child(7){animation-delay:.35s} .cat-card:nth-child(8){animation-delay:.40s}
    .cat-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow-lg); }
    .cat-card:active { transform: scale(.97); }

    /* coloured top band */
    .cat-card-top {
      padding: 1.3rem 1.2rem 1rem;
      position: relative; overflow: hidden;
    }
    .cat-card-top::after {
      content: ''; position: absolute; top: -20px; right: -20px;
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,255,255,0.20);
    }
    .cat-card-body { padding: 1rem 1.2rem 1.2rem; flex: 1; display: flex; flex-direction: column; }

    .cat-num {
      font-family: 'Kanit'; font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,0.80); letter-spacing: 2px;
      background: rgba(255,255,255,0.20); padding: 2px 8px;
      border-radius: 20px; display: inline-block; margin-bottom: .7rem;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .cat-ico {
      width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.22); color: #fff;
      transition: transform .22s ease;
    }
    .cat-card:hover .cat-ico { transform: scale(1.15) rotate(-6deg); }

    .cat-name { font-family: 'Kanit'; font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 3px; color: var(--text); }
    .cat-desc { font-size: 10px; color: var(--text2); line-height: 1.4; flex: 1; }
    .cat-badge {
      position: absolute; top: .9rem; right: .9rem;
      font-size: 8px; font-weight: 700; letter-spacing: 1px;
      color: rgba(255,255,255,0.90); background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.30); padding: 2px 8px;
      border-radius: 20px;
    }
    .cat-progress-wrap { margin-top: .7rem; }
    .cat-prog-track { height: 5px; background: rgba(0,0,0,0.06); border-radius: 3px; overflow: hidden; }
    .cat-prog-fill { height: 100%; border-radius: 3px; }
    .cat-prog-label { font-size: 9px; color: var(--text3); margin-top: 4px; font-weight: 600; }

    .direct-arrow {
      position: absolute; bottom: 1rem; right: 1rem;
      color: var(--text3); opacity: .5;
      transition: opacity .2s, transform .2s;
    }
    .cat-card:hover .direct-arrow { opacity: 1; transform: translate(3px,-3px); }

    /* ══════════════════════════
       SUB VIEW — redesigned
    ══════════════════════════ */
    .sub-hero-banner {
      border-radius: var(--radius-xl); overflow: hidden;
      margin-bottom: 1.4rem; position: relative;
      box-shadow: var(--shadow-md);
      animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both;
    }
    .sub-hero-bg {
      padding: 1.8rem 2rem 1.5rem;
      position: relative; color: #fff;
    }
    .sub-hero-bg::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(0,0,0,0.08);
    }
    .sub-hero-bg::after {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.12); pointer-events: none;
    }

    /* breadcrumb / back */
    .sub-breadcrumb {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 1rem; position: relative; z-index: 1;
    }
    .sub-back-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: 'Kanit'; font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.75); text-decoration: none; cursor: pointer;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      padding: 4px 12px 4px 8px; border-radius: 20px;
      transition: background .18s, color .18s;
    }
    .sub-back-link:hover { background: rgba(255,255,255,0.25); color: #fff; }
    .sub-bc-sep { color: rgba(255,255,255,0.4); font-size: 12px; }
    .sub-bc-cur { font-family: 'Kanit'; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); }

    .sub-hero-inner { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
    .sub-cat-ico {
      width: 56px; height: 56px; border-radius: 18px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #fff;
      background: rgba(255,255,255,0.20); border: 2px solid rgba(255,255,255,0.30);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .sub-meta { flex: 1; min-width: 0; }
    .sub-meta-num { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 3px; opacity: .8; }
    .sub-meta-title { font-family: 'Kanit'; font-size: clamp(18px,2.5vw,24px); font-weight: 800; line-height: 1.2; }
    .sub-meta-sub { font-size: 12px; margin-top: 3px; opacity: .75; }

    /* Stats pill row */
    .sub-stats-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 1.2rem; position: relative; z-index: 1;
    }
    .sub-stat-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28);
      border-radius: 20px; padding: 5px 14px;
      font-family: 'Kanit'; font-size: 12px; font-weight: 600; color: #fff;
      backdrop-filter: blur(4px);
    }
    .sub-stat-pill .ssp-dot { width: 7px; height: 7px; border-radius: 50%; }
    .sub-stat-pill.live-pill .ssp-dot { background: #6DFFC5; box-shadow: 0 0 6px #00C97A; animation: livePulse 2s infinite; }
    .sub-stat-pill.active-pill .ssp-dot { background: #fff; opacity: .8; }
    .sub-stat-pill.wip-pill .ssp-dot { background: rgba(255,255,255,0.4); }

    /* Toolbar under banner */
    .sub-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.4rem; flex-wrap: wrap; gap: 10px;
    }
    .sub-count-label { font-family: 'Kanit'; font-size: 12px; font-weight: 600; color: var(--text2); }

    .add-item-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'Kanit'; font-size: 12px; font-weight: 700;
      color: #fff; cursor: pointer;
      background: var(--grad-blue);
      border: none; padding: 10px 20px; border-radius: var(--radius-md);
      box-shadow: 0 6px 20px rgba(43,92,255,0.30);
      transition: opacity .18s, transform .18s, box-shadow .18s;
    }
    .add-item-btn:hover { opacity: .9; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(43,92,255,0.38); }
    .add-item-btn:active { transform: scale(.96); }

    /* SUB GRID — new card style inspired by Image 2 & 4 */
    .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media(max-width:680px){ .sub-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:380px){ .sub-grid { grid-template-columns: 1fr; } }

    .sub-card {
      display: flex; flex-direction: column;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
      text-decoration: none; color: var(--text);
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s;
      opacity: 0; animation: cardUp .45s cubic-bezier(.22,1,.36,1) both;
    }
    .sub-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
    .sub-card:active { transform: scale(.97); }
    .sub-card.wip { cursor: not-allowed; opacity: .6; filter: grayscale(0.3); }
    .sub-card.wip:hover { transform: none; box-shadow: var(--shadow-sm); }

    /* Top colored section (like Image 2/4 style) */
    .sub-card-top {
      padding: 1.1rem 1.1rem .85rem;
      position: relative; overflow: hidden;
    }
    .sub-card-top::after {
      content: ''; position: absolute; top: -20px; right: -20px;
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,255,255,0.18); pointer-events: none;
    }
    .sub-ico {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.22); color: #fff;
      margin-bottom: .6rem; flex-shrink: 0;
      transition: transform .2s ease;
    }
    .sub-card:hover .sub-ico { transform: scale(1.12) rotate(-5deg); }

    .sub-link-ico {
      color: var(--text3); transition: color .18s, transform .18s; flex-shrink: 0;
    }
    .sub-card:hover .sub-link-ico { color: var(--blue); transform: translate(2px,-2px); }

    /* STATUS BADGE */
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
      width: fit-content;
    }
    .status-badge.live   { color: #00C97A; background: rgba(0,201,122,0.12); }
    .status-badge.active { color: var(--blue); background: rgba(43,92,255,0.10); }
    .status-badge.wip    { color: var(--text3); background: rgba(168,180,204,0.15); }

       MODAL
    ══════════════════════════ */
    .modal-overlay {

    .modal {
      background: var(--white);

    .modal-title {
      font-family: 'Kanit'; font-size: 18px; font-weight: 700;
      color: var(--text); margin-bottom: 1.6rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close {
      width: 30px; height: 30px; border-radius: 9px;

      cursor: pointer; color: var(--text2);
      transition: background .15s, color .15s;

    .modal-close:hover { background: var(--border); color: var(--text); }

    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      font-family: 'Kanit'; font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text2); margin-bottom: .45rem; display: block;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 13px;
      color: var(--text); font-family: 'Sarabun', sans-serif; font-size: 13px;
      outline: none; transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--blue); background: #fff;
      box-shadow: 0 0 0 3px rgba(43,92,255,0.10);
    }
    .form-select { appearance: none; cursor: pointer; }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 1.6rem; justify-content: flex-end; }
    .btn-cancel {
      font-family: 'Kanit'; font-size: 12px; font-weight: 600;
      padding: 10px 22px; border-radius: var(--radius-md); cursor: pointer;
      background: var(--bg); border: 1.5px solid var(--border); color: var(--text2);
      transition: all .15s;
    }
    .btn-cancel:hover { border-color: var(--text3); color: var(--text); }
    .btn-save {
      font-family: 'Kanit'; font-size: 12px; font-weight: 700;
      padding: 10px 28px; border-radius: var(--radius-md); cursor: pointer;
      background: var(--grad-blue); border: none; color: #fff;
      box-shadow: 0 6px 20px rgba(43,92,255,0.30);
      transition: opacity .15s, transform .15s;
    }
    .btn-save:hover { opacity: .88; transform: translateY(-1px); }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid var(--border); margin-top: 3rem; padding-top: 1.4rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .footer span { font-size: 11px; color: var(--text3); letter-spacing: .5px; font-weight: 600; }
    .ft-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text3); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
      background: var(--white); border: 1.5px solid rgba(43,92,255,0.25);
      border-radius: var(--radius-md); padding: 12px 22px;
      font-family: 'Kanit'; font-size: 13px; font-weight: 600; color: var(--blue);
      box-shadow: 0 10px 40px rgba(43,92,255,0.15);
      transform: translateY(20px); opacity: 0;
      transition: all .28s cubic-bezier(.22,1,.36,1); pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ── SECTION COLORS ── */
    /* Mapping grad by sec id for top bands */
    .col-01 { background: var(--grad-blue); }

</head>

        icon:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>` },
    ]
  },
  { id:'06', title:'ประกาศสื่อสาร', sub:'Announcements', direct:true, href:'announcements.html',
    icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`, items:[]
  },
  { id:'07', title:'แผนงานฝ่ายอาคาร', sub:'Building Operations Plan', direct:true, href:'building_plan.html',
    icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>`, items:[]
  },
  { id:'08', title:'รายการทรัพย์สิน', sub:'Asset Inventory', direct:true, href:'assets.html',
    icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>`, items:[]
  },
];

function loadData() {
  try { const s = localStorage.getItem('gnr3_sections_v4'); return s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_SECTIONS)); }
  catch(e) { return JSON.parse(JSON.stringify(DEFAULT_SECTIONS)); }
}
function saveData() { localStorage.setItem('gnr3_sections_v4', JSON.stringify(SECTIONS)); }
let SECTIONS = loadData();
let currentSecId = null;

/* ── TAB SWITCH ── */
let currentTab = 'main';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('view-dash').classList.remove('active');
  document.getElementById('view-main').classList.remove('active');
  document.getElementById('view-sub').classList.remove('active');
  if (tab === 'dashboard') {
    const vd = document.getElementById('view-dash'); void vd.offsetWidth;
    renderDashboard(); vd.classList.add('active');
    history.replaceState('', document.title, window.location.pathname);
  } else { route(); }
}

/* ── DASHBOARD ── */
function renderDashboard() {
  const allItems = SECTIONS.flatMap(s => s.items);
  const liveCount  = allItems.filter(i=>i.status==='live').length;
  const activeCount= allItems.filter(i=>i.status==='active').length;
  const wipCount   = allItems.filter(i=>i.status==='wip').length;

  const kpis = [
    { label:'หมวดหมู่ทั้งหมด', val:SECTIONS.length, sub:'Total Categories' },
    { label:'รายการย่อยทั้งหมด', val:allItems.length, sub:'Sub Items' },
    { label:'พร้อมใช้งาน', val:liveCount+activeCount, sub:'Live & Active' },
    { label:'กำลังพัฒนา', val:wipCount, sub:'In Progress' },
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');

  document.getElementById('total-items-label').textContent = `${allItems.length} รายการ`;
  const maxN = Math.max(...SECTIONS.map(s=>s.items.length),1);
  document.getElementById('section-chart').innerHTML = SECTIONS.filter(s=>!s.direct||s.items.length).map(s=>{
    const c = SEC_COLORS[s.id];
    const pct = s.items.length ? Math.round((s.items.length/maxN)*100) : 0;
    return `<div class="sc-row">
      <div class="sc-label" title="${s.title}">${s.id} ${s.title}</div>
      <div class="sc-bar-wrap"><div class="sc-bar" style="width:${pct}%;background:${c.bar}"></div></div>
      <div class="sc-pct">${s.items.length}</div></div>`;
  }).join('');
  setTimeout(()=>{ document.querySelectorAll('.sc-bar').forEach(b=>{const w=b.style.width;b.style.width='0';setTimeout(()=>b.style.width=w,60);}); },60);

  const liveItems = SECTIONS.flatMap(s=>s.items.filter(i=>i.status==='live'||i.status==='active').slice(0,2).map(i=>({...i,secColor:SEC_COLORS[s.id].bar})));
  document.getElementById('live-count-label').textContent = `${liveCount+activeCount} รายการ`;
  document.getElementById('live-list').innerHTML = liveItems.slice(0,7).map(i=>`
    <div class="sl-row">
      <div class="sl-dot" style="background:${i.secColor}"></div>
      <div class="sl-name">${i.name}</div>
      <div class="sl-status ${i.status}">${i.status==='live'?'Live':'Active'}</div>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text3);padding:8px 0">ยังไม่มีรายการที่ใช้งานได้</div>';

  document.getElementById('cat-progress').innerHTML = SECTIONS.filter(s=>!s.direct).map(s=>{
    const c = SEC_COLORS[s.id];
    const done = s.items.filter(i=>i.status!=='wip').length;
    const pct  = s.items.length ? Math.round((done/s.items.length)*100) : 0;
    return `<div class="cpg-item">
      <div class="cpg-name">${s.id} ${s.title}</div>
      <div class="cpg-track"><div class="cpg-fill" style="width:${pct}%;background:${c.bar}"></div></div>
      <div class="cpg-nums"><span>${done}/${s.items.length}</span><span style="color:${c.bar}">${pct}%</span></div>
    </div>`;
  }).join('');
}

/* ── MAIN GRID ── */
function renderMain() {
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';
  SECTIONS.forEach(sec => {
    const c = SEC_COLORS[sec.id];
    const isDirect = sec.direct && sec.href;
    const el = document.createElement(isDirect ? 'a' : 'div');
    if (isDirect) { el.href = sec.href; el.target = sec.href.startsWith('http')?'_blank':'_self'; }
    else { el.addEventListener('click', ()=>navigate(sec.id)); }
    el.className = 'cat-card';

    const badgeTxt = sec.items.length ? `${sec.items.length} รายการ` : `→ ลิงก์`;
    const activeN = sec.items.filter(i=>i.status!=='wip').length;
    const progPct = sec.items.length ? Math.round((activeN/sec.items.length)*100) : 0;

    const progressHtml = (!isDirect && sec.items.length) ? `
      <div class="cat-progress-wrap">
        <div class="cat-prog-track">
          <div class="cat-prog-fill" style="width:${progPct}%;background:${c.bar}"></div>
        </div>
        <div class="cat-prog-label">${activeN}/${sec.items.length} พร้อมใช้</div>
      </div>` : '';

    const arrowHtml = isDirect ? `<span class="direct-arrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg></span>` : '';

    el.innerHTML = `
      <div class="cat-card-top ${c.cls}">
        <span class="cat-badge">${badgeTxt}</span>
        <span class="cat-num">${sec.id}</span>
        <div class="cat-ico">${sec.icon}</div>
      </div>
      <div class="cat-card-body">
        <div class="cat-name">${sec.title}</div>
        <div class="cat-desc">${sec.sub}</div>
        ${progressHtml}
        ${arrowHtml}
      </div>`;
    grid.appendChild(el);
  });
}

/* ── SUB GRID ── */
function renderSub(secId) {
  const sec = SECTIONS.find(s=>s.id===secId);
  if (!sec) { navigate(null); return; }
  currentSecId = secId;
  const c = SEC_COLORS[sec.id];

  // Build hero banner (no duplicate back button — breadcrumb style only)
  document.getElementById('sub-topbar').innerHTML = `
    <div class="sub-hero-banner">
      <div class="sub-hero-bg ${c.cls}">
        <div class="sub-breadcrumb">
          <a class="sub-back-link" href="#" id="back-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            หน้าหลัก
          </a>
          <span class="sub-bc-sep">›</span>
          <span class="sub-bc-cur">${sec.title}</span>
        </div>
        <div class="sub-hero-inner">
          <div class="sub-cat-ico">${sec.icon}</div>
          <div class="sub-meta">
            <div class="sub-meta-num">หมวด ${sec.id}</div>
            <div class="sub-meta-title">${sec.title}</div>
            <div class="sub-meta-sub">${sec.sub}</div>
          </div>
        </div>
        <div class="sub-stats-row" id="sub-stats-pills"></div>
      </div>
    </div>`;
  document.getElementById('back-btn').addEventListener('click', e=>{e.preventDefault();navigate(null);});

  const liveN=sec.items.filter(i=>i.status==='live').length;
  const activeN=sec.items.filter(i=>i.status==='active').length;
  const wipN=sec.items.filter(i=>i.status==='wip').length;

  document.getElementById('sub-stats-pills').innerHTML = `
    ${liveN ? `<div class="sub-stat-pill live-pill"><span class="ssp-dot"></span>${liveN} Live</div>` : ''}
    ${activeN ? `<div class="sub-stat-pill active-pill"><span class="ssp-dot"></span>${activeN} Active</div>` : ''}
    ${wipN ? `<div class="sub-stat-pill wip-pill"><span class="ssp-dot"></span>${wipN} In Progress</div>` : ''}
    <div class="sub-stat-pill" style="margin-left:auto"><span style="opacity:.7">รวม</span> &nbsp;${sec.items.length} รายการ</div>`;

  document.getElementById('sub-count-label').innerHTML =
    `${sec.items.length} รายการ &nbsp;·&nbsp; <span style="color:#00C97A;font-weight:700">${liveN} live</span> &nbsp;·&nbsp; <span style="color:var(--blue);font-weight:700">${activeN} active</span> &nbsp;·&nbsp; <span style="color:var(--text3);font-weight:700">${wipN} wip</span>`;

  const grid = document.getElementById('sub-grid');
  grid.innerHTML = '';
  sec.items.forEach((item, i) => {
    const isWip = item.status==='wip';
    const el = document.createElement('a');
    el.className = 'sub-card' + (isWip?' wip':'');
    el.style.animationDelay = `${i*0.055}s`;
    if (isWip) { el.href='#'; el.addEventListener('click',e=>e.preventDefault()); }
    else { el.href=item.href||'#'; el.target=item.href&&item.href.startsWith('http')?'_blank':'_self'; }

    const statusBadge = `<span class="status-badge ${item.status}"><span class="dot"></span>${item.status==='live'?'Live':item.status==='active'?'Active':'In Progress'}</span>`;
    const liveDot = item.status==='live'?`<span class="live-dot"></span>`:'';

    const linkSvg = !isWip ? `<span class="sub-link-ico"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${item.href&&item.href.startsWith('http')?'<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>':'<polyline points="9 18 15 12 9 6"/>'}</svg></span>` : '';

    const iconHtml = item.isCustom
      ? `<div class="sub-ico" style="font-size:18px;line-height:1">${item.icon||'📄'}</div>`
      : `<div class="sub-ico">${item.icon}</div>`;

    el.innerHTML = `
      <div class="sub-card-top ${c.cls}">
        ${iconHtml}
        <div class="sub-card-top-name">${liveDot}${item.name}</div>
        <div class="sub-card-top-desc">${item.desc}</div>
      </div>
      <div class="sub-card-body">
        ${statusBadge}
        ${linkSvg}
      </div>`;
    grid.appendChild(el);
  });
}

/* ── MODAL ── */
function openAddModal() {
  ['inp-name','inp-desc','inp-href','inp-icon'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('inp-status').value='active';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function saveItem() {
  const name=document.getElementById('inp-name').value.trim();
  const desc=document.getElementById('inp-desc').value.trim();
  const href=document.getElementById('inp-href').value.trim();
  const status=document.getElementById('inp-status').value;
  const iconIn=document.getElementById('inp-icon').value.trim();
  if (!name) { showToast('⚠ กรุณาระบุชื่อรายการ'); return; }
  const sec = SECTIONS.find(s=>s.id===currentSecId);
  if (!sec) return;
  sec.items.push({ name, desc:desc||name, href:href||'#', status, isCustom:true, icon:iconIn||'📄' });
  saveData(); closeModal(); renderSub(currentSecId);
  showToast(`✓ เพิ่ม "${name}" เรียบร้อยแล้ว`);
}
document.getElementById('modal-overlay').addEventListener('click',e=>{ if(e.target===document.getElementById('modal-overlay'))closeModal(); });

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ── ROUTER ── */
function navigate(secId) {
  if (secId) location.hash=secId;
  else { history.pushState('',document.title,window.location.pathname+window.location.search); route(); }
}
function route() {
  if (currentTab==='dashboard') return;
  const hash=location.hash.replace('#','');
  const found=hash&&SECTIONS.find(s=>s.id===hash);
  const vMain=document.getElementById('view-main');
  const vSub=document.getElementById('view-sub');
  const vDash=document.getElementById('view-dash');
  vMain.classList.remove('active'); vSub.classList.remove('active'); vDash.classList.remove('active');
  void vMain.offsetWidth;
  if (found) {
    void vSub.offsetWidth; renderSub(found.id); vSub.classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='main'));
    currentTab='main';
  } else { renderMain(); vMain.classList.add('active'); }
}
window.addEventListener('hashchange', route);
window.addEventListener('load', route);

/* ── CLOCK ── */
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function tick() {
  const n=new Date();
  document.getElementById('ct').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');
  document.getElementById('cd').textContent=`${DAYS[n.getDay()]}  ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()+543}`;
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
